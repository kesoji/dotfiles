<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoS 受け箱</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)">
<link rel="icon" id="favicon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>CoS 受け箱</h1>
    <p class="counts" id="counts" aria-live="polite"></p>
    <span class="conn" id="conn" data-state="connecting">つないでいます…</span>
  </div>
  <nav class="chips" id="chips" aria-label="CoS で絞り込む"></nav>
</header>

<main>
  <p class="error" id="error" role="alert" hidden></p>

  <section id="sec-chiefs" class="chiefs" hidden>
    <h2>CoS の状況と指示</h2>
    <div class="chief-cards" id="chief-cards"></div>
    <div class="compose-box" id="compose-box">
      <div id="compose-slot"></div>
      <p class="hint">短い指示向けです。画像や長いやり取り、急ぎの用件は herdr のペインで（CoS が作業中だと、指示はそのターンが終わってから読まれます）。CoS の返事は下の受け箱に届きます。</p>
      <p class="hint warn" id="compose-note" hidden></p>
    </div>
    <div class="list rows" id="list-msg" hidden></div>
  </section>

  <!-- 列（要返事・確認依頼・やること・読むだけ・TODO）。広い画面では横1行で、空の列も「なし」で場所を残す（style.css の段組み） -->
  <div class="cols" id="cols">
  <section id="sec-ask" class="col" hidden>
    <h2><span class="dot dot-ask"></span>要返事</h2>
    <div class="list" id="list-ask"></div>
    <p class="col-none">なし</p>
  </section>

  <section id="sec-review" class="col" hidden>
    <h2><span class="dot dot-review"></span>確認依頼</h2>
    <div class="list" id="list-review"></div>
    <p class="col-none">なし</p>
  </section>

  <section id="sec-todo" class="col" hidden>
    <h2><span class="dot dot-todo"></span>やること <small>やったら「やった」を押す</small></h2>
    <div class="list" id="list-todo"></div>
    <p class="col-none">なし</p>
  </section>

  <section id="sec-tell" class="col narrow" hidden>
    <h2><span class="dot dot-tell"></span>読むだけ <small>開いたら既読</small></h2>
    <div class="list rows" id="list-tell"></div>
    <p class="col-none">なし</p>
  </section>

  <section id="sec-tfile" class="col narrow" hidden>
    <h2><span class="dot dot-tfile"></span>TODO <small id="tfile-sub"></small></h2>
    <div id="tfile-add-slot"></div>
    <p class="hint warn" id="tfile-error" hidden></p>
    <div class="list rows" id="list-tfile"></div>
    <p class="hint" id="tfile-empty" hidden>未完了の TODO はありません。</p>
    <details class="tf-done" id="tfile-done" hidden>
      <summary>済んだもの <span id="tfile-done-count"></span></summary>
      <div class="list rows" id="list-tfile-done"></div>
    </details>
  </section>
  </div>

  <p class="empty" id="empty" hidden>いま待っているものはありません。</p>

  <details class="done" id="sec-done" hidden>
    <summary>済んだもの <span id="done-count"></span></summary>
    <div class="list rows" id="list-done"></div>
  </details>
</main>

<script src="md.js"></script>
<script src="thread.js"></script>
<script src="app.js"></script>
</body>
</html>
